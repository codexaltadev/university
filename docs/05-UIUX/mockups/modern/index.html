<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>University Modern — mockups</title>
<style>body{margin:0;font:15px/1.5 system-ui,sans-serif;background:#F5F7FA;color:#111827}header{padding:24px 32px}h1{margin:0;font-size:24px}section{padding:12px 32px 40px}h2{font-size:17px;margin:0 0 12px}.row{display:flex;gap:24px;align-items:flex-start;overflow-x:auto}.d{width:1280px;height:800px;transform:scale(.6);transform-origin:0 0;border:1px solid #E5E7EB;background:#fff}.dw{width:768px;height:480px;flex:none}.p{width:390px;height:780px;transform:scale(.6);transform-origin:0 0;border:10px solid #111827;border-radius:36px;background:#fff}.pw{width:234px;height:468px;flex:none}a{color:#1D4ED8}</style></head><body>
<header><h1>University Modern — page mockups (desktop 1280 + phone 390)</h1><p>Static HTML for the design review (UI/UX Part B §12). "Example University" is demo text; every text, logo and colour comes from Admin in the theme.</p></header>
<div id="pages"></div>
<script>
const pages=[['home','Home'],['programs','Program listing'],['program','Program page'],['microsite','Faculty / department microsite home'],['notices','Notice board'],['notice','Notice'],['news','News & events listing'],['article','News / event detail'],['admission','Admission + tuition + waiver calculator'],['search','Search'],['404','404']];
document.getElementById('pages').innerHTML=pages.map(([f,t])=>`<section><h2>${t} — <a href="${f}.html">open</a></h2><div class="row"><div class="dw"><iframe class="d" src="${f}.html" title="${t} desktop" loading="lazy"></iframe></div><div class="pw"><iframe class="p" src="${f}.html" title="${t} phone" loading="lazy"></iframe></div></div></section>`).join('');
</script></body></html>
