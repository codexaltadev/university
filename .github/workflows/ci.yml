name: CI

# Every push and pull request: style, security audit, build and the fast test suites.
# The slow module lifecycle suite runs in nightly.yml.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: university_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, gd, redis, zip, bcmath, exif, pdo_mysql, pcntl
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Security audit
        run: composer audit --no-interaction

      - name: Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Build assets
        run: npm ci && npm run build

      - name: Architecture tests
        run: vendor/bin/pest tests/Architecture

      - name: Feature tests
        run: vendor/bin/pest tests/Feature

      - name: Module tests
        run: vendor/bin/pest Modules
